name: Source tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config libegl1 libopengl0
      - run: python -m pip install -r asteroids/requirements-portable.txt pycairo
      - run: make test
      - run: python -m unittest discover -s asteroids/tests -v
